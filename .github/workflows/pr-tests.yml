name: PR tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r bridge/requirements.txt
      - name: Run Python test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run PostgreSQL schema checks
        run: |
          mkdir -p /tmp/pglite
          cd /tmp/pglite
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts @electric-sql/pglite@0.3.14 >/dev/null
          export PGLITE_MODULE=/tmp/pglite/node_modules/@electric-sql/pglite/dist/index.js
          cd "$GITHUB_WORKSPACE"
          node tests/assembler_schema.mjs
          node tests/knowledge_schema.mjs
          node tests/runner_schema.mjs
      - name: Compile changed Python
        run: |
          python -m py_compile src/business_brief/assembler.py src/business_brief/assembler_runtime.py src/business_brief/indexer.py src/business_brief/indexer_runtime.py src/business_brief/index_search.py bridge/runner.py
