[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-brief-v4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "supabase>=2.20,<3", "ocrmypdf>=16,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bb-technician = "business_brief.technician_cli:main"
bb-technician-worker = "business_brief.technician_worker:main"
bb-dashboard = "business_brief.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
