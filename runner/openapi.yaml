openapi: 3.1.0
info:
  title: Business Brief Deep/Memory Runner
  version: "1.0"
  description: >
    Authenticated, explicit server-side tools for the Business Brief v4
    Deep/Memory pipeline. All selection-bound operations require an exact
    source_id, manifest_id and manifest_sha256. Plan operations are read-only.
servers:
  - url: https://runner.businessbrief.cz
security:
  - bearerAuth: []
paths:
  /ready:
    get:
      operationId: runner_ready
      summary: Check runner readiness and capabilities
      responses:
        "200":
          description: Runner is ready
  /v1/status:
    post:
      operationId: pipeline_status
      summary: Check persisted Article Record and Indexer status for an exact selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Selection"
      responses:
        "200":
          description: Current exact-selection status
  /v1/assembler/plan:
    post:
      operationId: assembler_plan
      summary: Run deterministic Assembler in read-only plan mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Selection"
      responses:
        "200":
          description: Assembler summary without persistence
  /v1/assembler/persist:
    post:
      operationId: assembler_persist
      summary: Persist eligible immutable Article Records for an exact accepted manifest
      description: >
        Write operation. Use only after assembler_plan has no BLOCKED or
        NEEDS_REVIEW results. Identical replay is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Selection"
      responses:
        "200":
          description: Assembler persistence receipts
  /v1/indexer/plan:
    post:
      operationId: indexer_plan
      summary: Plan deterministic chunks for persisted Article Records without Cohere calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Selection"
      responses:
        "200":
          description: Indexer plan summary
  /v1/indexer/persist:
    post:
      operationId: indexer_persist
      summary: Create or replay the derived multilingual index for an exact selection
      description: >
        Write operation. Existing INDEXED exact-version runs are post-checked
        and returned as REPLAYED before any Cohere embedding call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Selection"
      responses:
        "200":
          description: Indexer persistence receipts
  /v1/search:
    post:
      operationId: search_index
      summary: Search indexed article chunks semantically and lexically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
      responses:
        "200":
          description: Separate vector and lexical rankings
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Selection:
      type: object
      additionalProperties: false
      required: [source_id, manifest_id, manifest_sha256]
      properties:
        source_id:
          type: string
          format: uuid
        manifest_id:
          type: string
          minLength: 1
          maxLength: 200
        manifest_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
